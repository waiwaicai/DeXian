name: DeXian
options:
  bundleIdPrefix: com.dexian
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_BITCODE: NO

targets:
  DeXian:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DeXian
        excludes:
          - "**/*.md"
          # 误传的重复文件名会让 Swift 报 "Filename used twice"，直接排除
          - "Features/Rss/SourceListView.swift"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 得闲
        CFBundleName: DeXian
        # xcodegen 给这两个键的默认值是字面量 "1.0" / "1"，
        # 不会自动引用 MARKETING_VERSION / CURRENT_PROJECT_VERSION，
        # 结果每次出包的 Info.plist 都停在 1.0 (1)。
        # 侧载工具会据此判断「不是新版本」而拒绝安装，
        # 用户也无法从「设置」里分辨手上装的是哪一版。
        # 显式写成构建变量，Xcode 在 Process Info.plist 阶段会替换。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 用于扫描书源分享二维码
        NSLocalNetworkUsageDescription: 书源可能位于局域网（例如自建的阅读服务器）
        # 只保留 NSAllowsArbitraryLoads：书源大量使用明文 http，
        # 且应用内没有任何 WKWebView。iOS 10+ 只要出现
        # NSAllowsArbitraryLoadsInWebContent，就会忽略 NSAllowsArbitraryLoads，
        # 导致所有 http 书源被 ATS 拦截（"resource could not be loaded"）。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          - http
          - https
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dexian.reader
        PRODUCT_NAME: DeXian
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "21"
        MARKETING_VERSION: "1.0.21"

  DeXianTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/DeXianTests
    dependencies:
      - target: DeXian

schemes:
  DeXian:
    build:
      targets:
        DeXian: all
        DeXianTests: [test]
    run:
      config: Debug
    # 关键：test 段必须显式列出 test target，否则 xcodegen 生成的 scheme
    # 不会把 DeXianTests 挂进 Test action，xcodebuild test 会直接报
    # "Scheme DeXian is not currently configured for the test action"。
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DeXianTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
