name: Build IPA

# 云编译：推送到 main / 手动触发 / 打 tag 都会出包
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          set -eu
          echo "==> runner: ${ImageOS:-unknown}"
          echo "==> DEVELOPER_DIR: ${DEVELOPER_DIR:-<unset>}"
          echo "==> xcode-select -p:"
          xcode-select -p || true
          echo "==> xcodebuild -version:"
          xcodebuild -version || true
          echo "==> sw_vers:"
          sw_vers || true
          echo "==> 已安装的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "==> 环境信息结束"

      - name: 安装 xcodegen
        run: |
          set -eu
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          set -eu
          echo "==> 开始生成 Xcode 工程"
          xcodegen generate
          echo "==> 工程已生成"
          ls -la DeXian.xcodeproj
          echo "==> 工程格式归一化（失败不阻断）"
          chmod +x scripts/normalize_project.sh || true
          ./scripts/normalize_project.sh || echo "warning: normalize_project.sh 返回非零，已忽略"
          echo "==> 工程准备完成"

      - name: 运行单元测试（不阻断出包）
        continue-on-error: true
        run: |
          set +e
          # 不使用管道：head/grep 提前退出会给上游 SIGPIPE，产生 134/141 假失败
          xcrun simctl list devices available > /tmp/sim.txt 2>/dev/null
          DEVICE="$(grep -m1 -o 'iPhone [0-9A-Za-z ]*' /tmp/sim.txt 2>/dev/null)"
          DEVICE="${DEVICE%% }"
          if [ -z "$DEVICE" ]; then DEVICE="iPhone 16"; fi
          echo "==> 测试机型：$DEVICE"
          xcodebuild test \
            -project DeXian.xcodeproj \
            -scheme DeXian \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            CODE_SIGNING_ALLOWED=NO
          echo "==> 单元测试结束（不阻断出包）"
          exit 0

      - name: 构建未签名 IPA
        run: |
          set -eu
          echo "==> 开始构建 IPA"
          chmod +x scripts/make_ipa.sh
          ./scripts/make_ipa.sh
          echo "==> 构建脚本执行完毕"

      - name: 整理产物
        run: |
          set -eu
          mkdir -p artifacts
          cp outputs/DeXian.ipa "artifacts/DeXian-unsigned-${{ github.run_number }}.ipa"
          if [ -f Preview/ui-layout.png ]; then cp Preview/ui-layout.png artifacts/; fi
          if [ -f Preview/logo.png ]; then cp Preview/logo.png artifacts/; fi
          ls -la artifacts

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeXian-unsigned-ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach IPA to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: DeXian-unsigned-ipa
          path: artifacts

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipa
          generate_release_notes: true
          body: |
            自动构建的未签名 IPA。
            安装方式：使用 AltStore / SideStore / Sideloadly / TrollStore 自签后安装。
